name: Build column pages

on:
  push:
    branches: [main]
    paths:
      - 'content/columns/**'
      - 'scripts/build-columns.mjs'
      - 'scripts/verify-column-indexing.mjs'
      - 'scripts/verify-site-seo.mjs'
      - 'column/styles.css'
      - 'column/filter.js'
      - 'consultation.html'
      - 'tokutei.html'
      - 'service/index.html'
      - 'sitemap.xml'
      - 'sitemap/index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-columns.yml'
  workflow_dispatch:

concurrency:
  group: column-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main branch
        run: git pull --rebase origin main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Generate column pages
        run: |
          if [ "${GITHUB_REPOSITORY}" = "ws-sound55/wasou-lp-b-preview" ]; then
            COLUMNS_PREVIEW_NOINDEX=true npm run build:columns
          else
            npm run build:columns
          fi
      - name: Verify indexing and discovery signals
        run: |
          if [ "${GITHUB_REPOSITORY}" = "ws-sound55/wasou-lp-b-preview" ]; then
            INDEXING_CHECK_PREVIEW=true npm run check:columns
          else
            npm run check:columns
          fi
      - name: Verify sitewide SEO signals
        run: npm run check:seo
      - name: Commit generated pages
        run: |
          if git diff --quiet -- column sitemap.xml sitemap/index.html; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column sitemap.xml sitemap/index.html
          git commit -m "Build column pages"
          git push
