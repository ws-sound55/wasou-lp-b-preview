name: Build column pages

on:
  push:
    branches: [main]
    paths:
      - 'content/columns/**'
      - 'scripts/build-columns.mjs'
      - 'column/styles.css'
      - 'column/filter.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-columns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Generate column pages
        run: npm run build:columns
      - name: Commit generated pages
        run: |
          if git diff --quiet -- column sitemap.xml; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column sitemap.xml
          git commit -m "Build column pages"
          git push
